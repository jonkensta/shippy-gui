[ui]
font_size = 11
log_file = shippy.log
default_weight = 3

; This file is a development-friendly template.
; The app also bundles a copy inside the package for bootstrap.

; The IBP server. Required: the return address on every label comes from
; its shipping settings (GET /shipping-settings).
[ibp]
url = http://192.168.1.156/api

[easypost]
apikey = YOUR_EASYPOST_API_KEY

[googlemaps]
apikey = YOUR_GOOGLE_MAPS_API_KEY

; Declared parcel dimensions in inches. USPS requires all three dimensions;
; Library Mail is priced by weight alone, so these just need to be large
; enough for any package. This section is optional and defaults to the
; values shown below.
[parcel]
length = 20
width = 14
height = 10
