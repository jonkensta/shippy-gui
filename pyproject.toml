[project]
name = "shippy-gui"
version = "0.1.0"
description = "GUI application for IBP shipping label generation using PySide6"
readme = "README.md"
authors = [
    { name = "Jonathan Starr", email = "github@jstarr.me" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8.0",
    "easypost>=10.3.0",
    "pillow>=12.2.0",
    "requests>=2.33.0",
    "googlemaps>=4.10.0",
    "pydantic>=2.12.5",
    "ibp-printing",
]

[project.optional-dependencies]
# Kept so existing `--extra windows` install commands keep working. pywin32 and
# WMI are now pulled in by ibp-printing itself (with a win32 platform marker).
windows = []
linux = [
    "ibp-printing[linux]",
]

[project.scripts]
# Same tool as ibp-printing's `ibp-print-diag`; name kept for existing docs/shortcuts.
diagnose-printers = "ibp_printing.diagnostics:main"

[project.gui-scripts]
shippy-gui = "shippy_gui.__main__:main"

[tool.uv.sources]
# For local development against a checkout next to this repo, temporarily use:
#   ibp-printing = { path = "../ibp-printing", editable = true }
ibp-printing = { git = "https://github.com/jonkensta/ibp-printing", rev = "2406c4ae84f32ed2901e0758c1ec5779cc1e4ce8" }

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
